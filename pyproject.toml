[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chewme-audit"
version = "0.1.0"
description = "Cost-audit reports for AI agent traces: find fixable waste, price it, fix it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fast-count = ["tiktoken", "tokenizers"]

[project.scripts]
chewme-audit = "chewme_audit.cli:main"

[tool.setuptools.packages.find]
include = ["chewme_audit*"]
